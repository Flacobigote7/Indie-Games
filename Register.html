<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>body {
            background-image: url('XPW.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }</style>
</head>
<body>

    <center>
  <h1 style="color:aliceblue">Registro de Usuario</h1>

  <form action="registro.php" method="post">
    <table border="1" cellpadding="8" cellspacing="0" bgcolor="#f9f9f9" width="500">
      <tr>
        <td align="right" bgcolor="#eaeaea"><b>Nombre de usuario:</b></td>
        <td><input type="text" name="username" size="30" placeholder="Ingresa tu usuario" required></td>
      </tr>
      <tr>
        <td align="right" bgcolor="#eaeaea"><b>Documento:</b></td>
        <td><input type="text" name="documento" size="30" placeholder="Número de documento" required></td>
      </tr>
      <tr>
        <td align="right" bgcolor="#eaeaea"><b>Dirección:</b></td>
        <td><input type="text" name="direccion" size="30" placeholder="Tu dirección" required></td>
      </tr>
      <tr>
        <td align="right" bgcolor="#eaeaea"><b>Teléfono:</b></td>
        <td><input type="tel" name="telefono" size="30" placeholder="Número telefónico" required></td>
      </tr>
      <tr>
        <td align="right" bgcolor="#eaeaea"><b>Correo electrónico:</b></td>
        <td><input type="email" name="email" size="30" placeholder="correo@ejemplo.com" required></td>
      </tr>
      <tr>
        <td align="right" bgcolor="#eaeaea"><b>Contraseña:</b></td>
        <td><input type="password" name="password" size="30" placeholder="Tu contraseña" required></td>
      </tr>
      <tr>
        <td colspan="2" align="center" bgcolor="#eaeaea">
          <a href="login.html"><input type="button" value="¿Ya tienes cuenta? Iniciar sesión" style="font-size: 11px; padding: 4px 8px;"></a>
          <input type="submit" value="Registrarse" style="font-size: 16px; padding: 8px 20px; font-weight: bold;">
        </td>
      </tr>
    </table>
  </form>
</center>

</body>
</html>
