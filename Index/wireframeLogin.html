<!DOCTYPE html>
<html lang="es" style="height: 100%; margin: 0; padding: 0;">
<head>
     <link rel="stylesheet" href="CSS/Wire.css"> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion</title>
</head>

<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; height: 100%; box-sizing: border-box; background-color: #fff;">

    
    <div style="display: flex; flex-direction: column; min-height: 100vh; width: 100%; border: 3px solid #000; box-sizing: border-box;">

        
        <header style="border-bottom: 3px solid #000; padding: 15px; background-color: #f0f0f0;">
            <nav>
                <ul style="list-style: none; margin: 0; padding: 0; display: flex; justify-content: space-between; align-items: center;">
                    <li><strong>Pagina Index</strong></li> <!-- Entidad 1: &amp; -->
                    
                </ul>
            </nav>
        </header>


        
        <main style="display: flex; flex: 1;">

            
        <section style="flex: 2; border-right: 3px solid #000; padding: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background-color: #f0f0f0;">
    <img src="Imagenes/XP.jpg" alt="Imagen del sitio" style="max-width: 130%; max-height: 600%; object-fit: contain; display: block;">
</section>


            
            <section style="flex: 1; padding: 20px; background-color: #fff;">
                
                <h2 style="text-align: center; color: #00a884; margin-top: 0;">Inicia Sesion</h2>

                
                <form action="#" method="post" style="display: flex; flex-direction: column; gap: 12px;">
                    
                    <div>
                        <label for="txt-nombre">Nombre Completo:</label><br>
                        <input type="text" id="txt-nombre" name="nombre" style="width: 100%; padding: 6px; box-sizing: border-box;" required>
                    </div>

                    <div>
                        <label for="txt-email">Correo Electrónico:</label><br>
                        <input type="email" id="txt-email" name="email" style="width: 100%; padding: 6px; box-sizing: border-box;" required>
                    </div>

                    <div>
                        <label for="txt-password">Contraseña:</label><br>
                        <input type="password" id="txt-password" name="password" style="width: 100%; padding: 6px; box-sizing: border-box;" required>
                    </div>

                    <div style="text-align: center; margin-top: 10px;">
                        <button type="submit" style="background-color: #00a884; color: white; padding: 8px 16px; border: none; cursor: pointer;">
                            Ingresar
                        </button>
                    </div>

                </form>

                <hr style="margin: 20px 0; border: 1px solid #ccc;">

                
                <h4 style="margin-bottom: 8px; text-align: center;">Servicio Tecnico</h4>
                <table border="1" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem;">
                    <thead>
                        <tr>
                            <th colspan="2" style="background-color: #f0f0f0; text-align: center; padding: 6px;">
                                Opciones de ayuda
                            </th>
                        </tr>
                        <tr>
                            <th style="padding: 6px;">¿No tiene una cuenta?</th>
                            <th style="padding: 6px;"><a href="register.html">Regístrate aquí</a></th>
                            <td colspan="3" align="center">
                    
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="padding: 6px;">¿Se olvido de su contraseña?</td>
                            <td style="padding: 6px;"><a href="Recupera_contraseña.html">Recuperar</a></td>
                        </tr>
                       
                    </tbody>
                </table>

            </section>

        </main>


        
        <footer style="border-top: 3px solid #000; padding: 12px; text-align: center; background-color: #f0f0f0;">
            <p style="margin: 0;">
                Desarrollado por: <strong>IndexStudio</strong> &copy; 2026. Todos los derechos reservados.
            </p> <!-- Entidad 2: &copy; -->
        </footer>

    </div>

</body>
</html>
